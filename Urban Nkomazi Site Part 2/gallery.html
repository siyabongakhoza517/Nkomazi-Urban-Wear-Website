<style>
/* FIXED GRID FOR 6 LOOKS - makes images fit like your screenshot */
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}
.g-item {
  position: relative;
  height: 380px;
  background: #111;
  border-radius: 6px;
  overflow: hidden;
}
.g-item.red { background: #c00; }
.g-item img {
  width: 100%;
  height: 100%;
  object-fit: cover; /* fixes stretched look */
  display: block;
}
.g-overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.25);
  color: white;
  font-family: 'Anton', sans-serif;
  font-size: 18px;
  text-align: center;
  line-height: 1.1;
}
@media (max-width: 768px) {
  .gallery-grid { grid-template-columns: 1fr 1fr; }
  .g-item { height: 260px; }
}
</style>
</head>

</div>
</nav>
